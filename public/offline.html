<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OvaMind AI – Offline</title>
<style>
  body { font-family: Inter, sans-serif; background: #7C3AED; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 24px; }
  .icon { font-size: 64px; margin-bottom: 20px; }
  h1 { font-size: 24px; margin-bottom: 10px; }
  p { opacity: 0.8; font-size: 15px; line-height: 1.6; }
  button { margin-top: 24px; background: white; color: #7C3AED; border: none; border-radius: 12px; padding: 14px 28px; font-size: 15px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div>
    <div class="icon">🌸</div>
    <h1>You're offline</h1>
    <p>OvaMind AI needs an internet connection<br>for AI features. Please reconnect and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
